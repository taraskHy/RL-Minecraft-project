<title>Parkour Agent Replays</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a course list beside one large 3D stage; the stage carries a tick HUD and a scrubber, like a replay editor. */
:root {
  --bg: #e9edf1;
  --panel: #f8fafb;
  --fg: #1a2027;
  --muted: #56616c;
  --line: #d3d9df;
  --accent: #2e7a4c;
  --accent-ink: #ffffff;
  --stone: #9097a0;
  --stone-edge: #5f666e;
  --start: #6f9c78;
  --goal: #d4a21c;
  --player: #2f63c9;
  --trail: #2f63c9;
  --good: #1f7a45;
  --bad: #b3352f;
  --warn: #9a6a00;
  --stage: #dfe5ea;
  --font-display: "Silkscreen", "Courier New", monospace;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1418; --panel: #161d23; --fg: #e4e9ee; --muted: #93a0ac; --line: #26313a; --accent: #5cbf85;
    --accent-ink: #0b1a11; --stone: #7a828b; --stone-edge: #3c434a; --start: #5f8f69; --goal: #e3b63a;
    --player: #6f9dff; --trail: #6f9dff; --good: #57c486; --bad: #f07a72; --warn: #e0b04a; --stage: #12181d;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1418; --panel: #161d23; --fg: #e4e9ee; --muted: #93a0ac; --line: #26313a; --accent: #5cbf85;
  --accent-ink: #0b1a11; --stone: #7a828b; --stone-edge: #3c434a; --start: #5f8f69; --goal: #e3b63a;
  --player: #6f9dff; --trail: #6f9dff; --good: #57c486; --bad: #f07a72; --warn: #e0b04a; --stage: #12181d;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 14px; line-height: 1.5; }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 18px 28px; max-width: 1400px; margin: 0 auto; display: grid; gap: 14px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 18px; }
h1 { font-family: var(--font-display); font-weight: 400; font-size: 22px; letter-spacing: 0.02em; margin: 0; text-wrap: balance; }
.sub { color: var(--muted); margin: 0; max-width: 70ch; }
.meta { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.main { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 14px; align-items: start; }
.list { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; display: grid; grid-template-rows: auto minmax(0, 1fr); max-height: 640px; min-width: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px; border-bottom: 1px solid var(--line); }
.chip { font: 600 12px var(--font-body); border: 1px solid var(--line); background: transparent; color: var(--muted); border-radius: 999px; padding: 3px 10px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.rows { overflow-y: auto; }
.row { width: 100%; display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; align-items: center; text-align: left; padding: 9px 12px; border: 0; border-bottom: 1px solid var(--line); background: transparent; color: var(--fg); font: inherit; cursor: pointer; }
.row:hover { background: color-mix(in srgb, var(--accent) 8%, transparent); }
.row[aria-current="true"] { background: color-mix(in srgb, var(--accent) 16%, transparent); }
.row .name { font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .info { grid-column: 1 / -1; color: var(--muted); font-family: var(--font-mono); font-size: 11.5px; font-variant-numeric: tabular-nums; }
.pill { font: 600 11px var(--font-body); padding: 1px 8px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; }
.pill.success { color: var(--good); }
.pill.fell { color: var(--bad); }
.pill.truncated { color: var(--warn); }
.stage { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; min-width: 0; display: grid; }
.canvas-box { position: relative; aspect-ratio: 16 / 9; max-width: 100%; background: var(--stage); }
canvas { display: block; width: 100%; height: 100%; }
.hud { position: absolute; left: 10px; top: 10px; display: grid; gap: 2px; font-family: var(--font-mono); font-size: 12px; font-variant-numeric: tabular-nums; background: color-mix(in srgb, var(--panel) 82%, transparent); border: 1px solid var(--line); border-radius: 4px; padding: 6px 9px; pointer-events: none; }
.hud b { font-family: var(--font-display); font-weight: 400; font-size: 13px; }
.end { position: absolute; right: 10px; top: 10px; }
.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 10px 12px; border-top: 1px solid var(--line); }
.btn { font: 600 13px var(--font-body); border: 1px solid var(--line); background: var(--bg); color: var(--fg); border-radius: 4px; padding: 5px 12px; cursor: pointer; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); min-width: 72px; }
.btn:focus-visible, .chip:focus-visible, .row:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
input[type="range"] { flex: 1 1 200px; accent-color: var(--accent); min-width: 120px; }
select { font: inherit; border: 1px solid var(--line); background: var(--bg); color: var(--fg); border-radius: 4px; padding: 4px 6px; }
.notes { color: var(--muted); font-size: 13px; max-width: 80ch; margin: 0; }
.notes code { font-family: var(--font-mono); font-size: 12px; }
@media (max-width: 860px) {
  .main { grid-template-columns: minmax(0, 1fr); }
  .list { max-height: 260px; }
}
</style>

<div class="wrap">
  <header>
    <div>
      <h1>Parkour agent replays</h1>
      <p class="sub" id="sub"></p>
    </div>
    <div class="meta" id="meta"></div>
  </header>
  <div class="main">
    <nav class="list" aria-label="Courses">
      <div class="chips" id="chips" role="group" aria-label="Filter by difficulty level"></div>
      <div class="rows" id="rows"></div>
    </nav>
    <section class="stage" aria-label="Replay">
      <div class="canvas-box" id="box">
        <canvas id="c"></canvas>
        <div class="hud" id="hud"></div>
        <div class="end" id="end"></div>
      </div>
      <div class="controls">
        <button class="btn primary" id="play" type="button">Pause</button>
        <button class="btn" id="restart" type="button">Restart</button>
        <input type="range" id="scrub" min="0" max="1" step="1" value="0" aria-label="Tick">
        <label class="meta" for="speed">Speed</label>
        <select id="speed">
          <option value="0.25">0.25x</option><option value="0.5">0.5x</option>
          <option value="1" selected>1x (20 ticks/s)</option><option value="2">2x</option>
        </select>
        <label class="meta" for="cam">Camera</label>
        <select id="cam"><option value="follow" selected>Follow</option><option value="orbit">Orbit</option></select>
      </div>
    </section>
  </div>
  <p class="notes" id="notes"></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
const DATA = /*DATA*/;
const $ = id => document.getElementById(id);
const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const RESULT_LABEL = { success: 'made it', fell: 'fell', truncated: 'stalled' };

$('sub').textContent = DATA.subtitle;
$('meta').textContent = DATA.meta;
$('notes').innerHTML = DATA.notes;

// Course list and level filter.
const levels = [...new Set(DATA.episodes.map(e => e.group))];
let filter = 'all';
let current = 0;
function renderChips () {
  const box = $('chips');
  box.innerHTML = '';
  for (const g of ['all', ...levels]) {
    const b = document.createElement('button');
    b.className = 'chip';
    b.type = 'button';
    b.textContent = g === 'all' ? 'All' : g;
    b.setAttribute('aria-pressed', String(filter === g));
    b.onclick = () => { filter = g; renderChips(); renderRows() };
    box.appendChild(b);
  }
}
function renderRows () {
  const box = $('rows');
  box.innerHTML = '';
  DATA.episodes.forEach((e, i) => {
    if (filter !== 'all' && e.group !== filter) return;
    const b = document.createElement('button');
    b.className = 'row';
    b.type = 'button';
    b.setAttribute('aria-current', String(i === current));
    b.innerHTML = `<span class="name"></span><span class="pill ${e.result}">${RESULT_LABEL[e.result]}</span><span class="info"></span>`;
    b.querySelector('.name').textContent = e.title;
    b.querySelector('.info').textContent = `${e.n - 1} jumps · platform ${e.cp}/${e.n - 1} · ${e.ticks} ticks (${(e.ticks / 20).toFixed(1)} s)`;
    b.onclick = () => load(i);
    box.appendChild(b);
  });
}

// Scene.
const canvas = $('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, 16 / 9, 0.1, 400);
const controls = new THREE.OrbitControls(camera, canvas);
controls.enableDamping = true;
const hemi = new THREE.HemisphereLight(0xffffff, 0x445566, 0.85);
const sun = new THREE.DirectionalLight(0xffffff, 0.75);
sun.position.set(30, 60, 20);
scene.add(hemi, sun);
let courseGroup = new THREE.Group();
scene.add(courseGroup);
const player = new THREE.Group();
const bodyMat = new THREE.MeshLambertMaterial();
const body = new THREE.Mesh(new THREE.BoxGeometry(0.6, 1.8, 0.6), bodyMat);
body.position.y = 0.9;
const visor = new THREE.Mesh(new THREE.BoxGeometry(0.44, 0.16, 0.08), new THREE.MeshBasicMaterial({ color: 0x111111 }));
visor.position.set(0, 1.55, -0.32);
player.add(body, visor);
scene.add(player);
const trailGeo = new THREE.BufferGeometry();
const trailMat = new THREE.LineBasicMaterial();
const trail = new THREE.Line(trailGeo, trailMat);
scene.add(trail);

function applyTheme () {
  scene.background = new THREE.Color(css('--stage'));
  bodyMat.color = new THREE.Color(css('--player'));
  trailMat.color = new THREE.Color(css('--trail'));
  if (DATA.episodes[current]) buildCourse(DATA.episodes[current]);
}

function buildCourse (e) {
  scene.remove(courseGroup);
  courseGroup = new THREE.Group();
  const geo = new THREE.BoxGeometry(1, 1, 1);
  const edges = new THREE.EdgesGeometry(geo);
  const edgeMat = new THREE.LineBasicMaterial({ color: new THREE.Color(css('--stone-edge')) });
  const mats = {
    stone: new THREE.MeshLambertMaterial({ color: new THREE.Color(css('--stone')) }),
    start: new THREE.MeshLambertMaterial({ color: new THREE.Color(css('--start')) }),
    goal: new THREE.MeshLambertMaterial({ color: new THREE.Color(css('--goal')) })
  };
  e.platforms.forEach((p, k) => {
    const mat = k === 0 ? mats.start : k === e.platforms.length - 1 ? mats.goal : mats.stone;
    for (let x = p[0]; x <= p[1]; x++) {
      for (let z = p[2]; z <= p[3]; z++) {
        const m = new THREE.Mesh(geo, mat);
        m.position.set(x + 0.5, p[4] + 0.5, z + 0.5);
        const l = new THREE.LineSegments(edges, edgeMat);
        l.position.copy(m.position);
        courseGroup.add(m, l);
      }
    }
  });
  scene.add(courseGroup);
}

let ep = null; let t = 0; let playing = true; let lastTime = null;
const camPos = new THREE.Vector3(); const camLook = new THREE.Vector3();

function load (i) {
  current = i;
  ep = DATA.episodes[i];
  buildCourse(ep);
  const pts = [];
  for (let k = 0; k < ep.pos.length; k += 3) pts.push(new THREE.Vector3(ep.pos[k], ep.pos[k + 1] + 0.05, ep.pos[k + 2]));
  trailGeo.setFromPoints(pts);
  $('scrub').max = String(ep.yaw.length - 1);
  t = 0;
  playing = true;
  $('play').textContent = 'Pause';
  // Orbit target: centre of the course.
  const c = new THREE.Vector3();
  ep.platforms.forEach(p => c.add(new THREE.Vector3((p[0] + p[1] + 1) / 2, p[4] + 1, (p[2] + p[3] + 1) / 2)));
  c.multiplyScalar(1 / ep.platforms.length);
  controls.target.copy(c);
  camera.position.set(c.x + 18, c.y + 22, c.z + 18);
  setPose(true);
  renderRows();
}

function stateAt (tt) {
  const n = ep.yaw.length;
  const i = Math.max(0, Math.min(n - 1, Math.floor(tt)));
  const j = Math.min(n - 1, i + 1);
  const f = Math.min(1, Math.max(0, tt - i));
  const p = k => ep.pos[3 * i + k] + (ep.pos[3 * j + k] - ep.pos[3 * i + k]) * f;
  let dy = ep.yaw[j] - ep.yaw[i];
  if (dy > Math.PI) dy -= 2 * Math.PI;
  if (dy < -Math.PI) dy += 2 * Math.PI;
  return { x: p(0), y: p(1), z: p(2), yaw: ep.yaw[i] + dy * f, tick: i };
}

function setPose (snap) {
  const s = stateAt(t);
  player.position.set(s.x, s.y, s.z);
  player.rotation.y = s.yaw;
  trail.geometry.setDrawRange(0, s.tick + 1);
  $('scrub').value = String(s.tick);
  const plat = ep.cpAt[s.tick];
  $('hud').innerHTML = `<b>${ep.title}</b><span>tick ${String(s.tick).padStart(4, ' ')} / ${ep.yaw.length - 1}  ·  ${(s.tick / 20).toFixed(2)} s</span><span>platform ${plat} / ${ep.n - 1}</span><span>x ${s.x.toFixed(2)}  y ${s.y.toFixed(2)}  z ${s.z.toFixed(2)}</span>`;
  const done = s.tick >= ep.yaw.length - 1;
  $('end').innerHTML = done ? `<span class="pill ${ep.result}">${RESULT_LABEL[ep.result]}</span>` : '';
  if ($('cam').value === 'follow') {
    const fx = -Math.sin(s.yaw); const fz = -Math.cos(s.yaw);
    const want = new THREE.Vector3(s.x - fx * 5.5, s.y + 3.2, s.z - fz * 5.5);
    const look = new THREE.Vector3(s.x + fx * 3, s.y + 0.6, s.z + fz * 3);
    if (snap) { camPos.copy(want); camLook.copy(look) } else { camPos.lerp(want, 0.08); camLook.lerp(look, 0.12) }
    camera.position.copy(camPos);
    camera.lookAt(camLook);
  }
}

function resize () {
  const box = $('box');
  const w = box.clientWidth; const h = box.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}

function frame (now) {
  requestAnimationFrame(frame);
  if (lastTime === null) lastTime = now;
  const dt = Math.min(0.1, (now - lastTime) / 1000);
  lastTime = now;
  if (ep && playing) {
    t = Math.min(ep.yaw.length - 1, t + dt * 20 * Number($('speed').value));
    if (t >= ep.yaw.length - 1) { playing = false; $('play').textContent = 'Play' }
  }
  if (ep) setPose(false);
  controls.enabled = $('cam').value === 'orbit';
  if (controls.enabled) controls.update();
  renderer.render(scene, camera);
}

$('play').onclick = () => {
  if (!ep) return;
  if (t >= ep.yaw.length - 1) t = 0;
  playing = !playing;
  $('play').textContent = playing ? 'Pause' : 'Play';
};
$('restart').onclick = () => { t = 0; playing = true; $('play').textContent = 'Pause'; setPose(true) };
$('scrub').oninput = e => { t = Number(e.target.value); playing = false; $('play').textContent = 'Play'; setPose(true) };
$('cam').onchange = () => setPose(true);
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  if (e.code === 'Space') { e.preventDefault(); $('play').click() }
  if (e.code === 'ArrowRight') { t = Math.min(ep.yaw.length - 1, Math.floor(t) + 1); playing = false; $('play').textContent = 'Play' }
  if (e.code === 'ArrowLeft') { t = Math.max(0, Math.floor(t) - 1); playing = false; $('play').textContent = 'Play' }
});
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);
new MutationObserver(applyTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
new ResizeObserver(resize).observe($('box'));

renderChips();
applyTheme();
load(0);
resize();
requestAnimationFrame(frame);
</script>
